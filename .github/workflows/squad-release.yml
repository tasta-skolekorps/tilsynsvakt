name: Squad Release

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: write

concurrency:
  group: squad-release
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet test Tilsynsvakt.slnx

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    env:
      AZURE__TENANTID: ${{ vars.AZURE_TENANT_ID }}
      AZURE__SUBSCRIPTIONID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE__LOCATION: ${{ vars.AZURE_LOCATION }}
      AZURE__RESOURCEGROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      Frontend__Origin: ${{ vars.FRONTEND_ORIGIN }}
    steps:
      - name: Validate required secrets
        shell: bash
        env:
          ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          for required in ADMIN_API_KEY ADMIN_USERNAME ADMIN_PASSWORD; do
            if [[ -z "${!required}" ]]; then
              echo "::error::Mangler obligatorisk hemmelighet: $required"
              exit 1
            fi
          done

      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Install Aspire CLI
        run: |
          curl -sSL https://aspire.dev/install.sh | bash
          echo "$HOME/.aspire/bin" >> "$GITHUB_PATH"

      - name: Deploy
        env:
          Admin__ApiKey: ${{ secrets.ADMIN_API_KEY }}
          Admin__Username: ${{ secrets.ADMIN_USERNAME }}
          Admin__Password: ${{ secrets.ADMIN_PASSWORD }}
        run: aspire deploy --non-interactive
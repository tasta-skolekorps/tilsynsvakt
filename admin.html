<!doctype html>
<html lang="nb">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1b3f66">
  <meta name="description" content="Administrasjon av tilsynsvakter i gymsalen på Tasta skole.">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self' https: http://localhost:5187 http://127.0.0.1:5187; form-action 'self'; base-uri 'self'; object-src 'none'">
  <title>Admin · Tilsynsvakt</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css">
  <script src="./config.js"></script>
  <script type="module" src="./js/admin.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Hopp til innhold</a>
  <header class="site-header">
    <a class="brand" href="./index.html" aria-label="Til forsiden">
      <span class="brand-mark" aria-hidden="true">T</span>
      <span class="brand-name">Tasta skolekorps <small>Tilsynsvakt · admin</small></span>
    </a>
  </header>

  <main id="main" class="admin-shell">
    <div id="notice" class="notice" role="status" aria-live="polite" hidden></div>

    <section class="view" aria-labelledby="admin-title">
      <div class="page-heading">
        <div>
          <p class="eyebrow">Administrasjon</p>
          <h1 id="admin-title">Vakter og utsjekk</h1>
        </div>
      </div>

      <form id="auth-form" class="admin-auth">
        <div class="admin-grid">
          <label>
            Brukernavn
            <input id="username" name="username" type="text" autocomplete="username" required>
          </label>
          <label>
            Passord
            <input id="password" name="password" type="password" autocomplete="current-password" required>
          </label>
        </div>
        <div class="shift-actions">
          <button class="button button-primary" type="submit">Logg inn</button>
        </div>
        <p class="small-copy muted">Opplysningene lagres bare i denne nettleserfanen.</p>
      </form>

      <section id="admin-panel" hidden>
        <div class="shift-actions admin-session">
          <button class="button button-secondary" id="logout" type="button">Logg ut</button>
        </div>
        <form id="season-form" class="admin-toolbar">
          <fieldset class="season-picker">
            <legend>Sesong</legend>
            <label class="season-option"><input type="radio" name="season" value="autumn" checked><span>Høst–jul</span></label>
            <label class="season-option"><input type="radio" name="season" value="spring"><span>Januar–juni</span></label>
          </fieldset>
          <div class="year-picker">
            <label for="year">År</label>
            <div class="year-stepper">
              <button class="button button-secondary" id="year-prev" type="button" aria-label="Forrige år">‹</button>
              <input id="year" name="year" type="number" min="2000" max="2100" inputmode="numeric" required>
              <button class="button button-secondary" id="year-next" type="button" aria-label="Neste år">›</button>
            </div>
          </div>
        </form>
        <div class="section-heading">
          <h2 id="totals-heading">Summering per tilsynsvakt</h2>
          <span id="season-range" class="muted"></span>
        </div>
        <div id="totals" aria-live="polite">
          <p class="loading">Laster summering …</p>
        </div>

        <h2 class="subheading">Alle vakter</h2>
        <div id="duties" class="admin-duty-list" aria-live="polite">
          <p class="loading">Laster vakter …</p>
        </div>
      </section>
    </section>
  </main>

  <footer class="site-footer">
    <p>Tasta skolekorps <span aria-hidden="true">·</span> Tilsynsvakt admin</p>
    <a href="tel:+4792423946">Spørsmål? 924 23 946</a>
  </footer>
</body>
</html>
